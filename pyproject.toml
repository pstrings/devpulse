[project]
name = "devpulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pstrings", email = "masuya444@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pywinctl>=0.4.1",
]

[project.scripts]
devpulse = "devpulse:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
